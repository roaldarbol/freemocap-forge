# One workflow for everything:
#   - pull_request:      build whatever is not already on the channel (dry run, no upload)
#   - push to main:      build + upload
#   - workflow_dispatch: build + upload (use this to bootstrap an empty channel)
#
# There is no per-recipe matrix or change detection. Every run invokes
# rattler-build over the recipes with --skip-existing=all: anything whose
# version + build number is already published on the channel is skipped in
# seconds, and rattler-build topologically sorts the rest, so inter-recipe
# dependencies (e.g. freemocap -> skellycam -> skellylogs) build in the right
# order even on a completely empty channel.
#
# The linux-64 job builds all recipes (it owns the noarch ones); osx-arm64 and
# win-64 only build the platform-specific recipes (see `build-arch` in pixi.toml).
name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
            build_task: build
            publish_task: publish
          - platform: osx-arm64
            os: macos-14
            build_task: build-arch
            publish_task: publish-arch
          - platform: win-64
            os: windows-latest
            build_task: build-arch
            publish_task: publish-arch

    permissions:
      # OIDC token for trusted publishing to prefix.dev
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      # PRs only build; pushes to main and manual runs publish (build + upload
      # + index in one rattler-build invocation, authenticated via OIDC).
      - name: Build recipes (and publish on main)
        run: pixi run ${{ github.event_name == 'pull_request' && matrix.build_task || matrix.publish_task }}

      - name: Store packages as CI artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packages-${{ matrix.platform }}
          path: output/**/*.conda
          if-no-files-found: ignore

  # End-to-end check of what is actually live on the channel: solve + install
  # the freemocap stack from prefix.dev on every platform and import it.
  smoke-test:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            os: ubuntu-latest
          - platform: osx-arm64
            os: macos-14
          - platform: win-64
            os: windows-latest
    steps:
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      # Mirrors the README install instructions: a pixi workspace with this
      # channel first, then conda-forge. (Not `pixi exec` — its solve excluded
      # our skellyforge under strict channel priority, unlike workspaces.)
      - name: Install freemocap from the channel and import the stack
        shell: bash
        run: |
          pixi init smoke -c https://prefix.dev/roaldarbol/freemocap-forge -c conda-forge
          cd smoke
          pixi add freemocap
          pixi run python -c "import freemocap, skellycam, skellytracker, skellyforge, skelly_synchronize, skellylogs, skellypings, mediapipe; print('all imports ok')"
