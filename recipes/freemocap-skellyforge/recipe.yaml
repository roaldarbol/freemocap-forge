# Named freemocap-skellyforge, not skellyforge: conda-forge already ships a
# skellyforge 2024.12.1009 built from the old PyPI release (pre-v2 code, numpy
# 1.26 pins), and under strict channel priority a name that exists on
# conda-forge cannot be resolved from this channel. The distinct name sidesteps
# that; the installed Python module is still `skellyforge`. Fold this back into
# a plain `skellyforge` package once upstream releases v2 and conda-forge
# updates.
schema_version: 1

context:
  # flit reads the version from skellyforge/__init__.py at the pinned commit
  version: "2024.12.1009"
  # freemocap/skellyforge @ main, 2026-08-05
  git_rev: ddf24f3aaa4388e5883afada217137223546c24e

package:
  name: freemocap-skellyforge
  version: ${{ version }}

source:
  git: https://github.com/freemocap/skellyforge
  rev: ${{ git_rev }}

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - skellyforge = skellyforge.__main__:run

requirements:
  host:
    - python >=3.10
    - pip
    - flit-core
  run:
    - python >=3.10
    - numpy
    - scipy
    - pandas
    - toml >=0.10.2
    - pyyaml >=6.0
    - pyarrow >=21.0.0
  run_constraints:
    # unsatisfiable: forbids co-installation with conda-forge's skellyforge,
    # which ships the same `skellyforge` Python module
    - skellyforge <0a0

tests:
  - python:
      imports:
        - skellyforge
      pip_check: false

about:
  homepage: https://github.com/freemocap/skellyforge
  summary: Post-processing (filtering, gap-filling, rotation) for FreeMoCap motion capture data
  license: AGPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
