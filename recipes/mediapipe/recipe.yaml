# mediapipe is not on conda-forge (bazel build), so this repackages the
# official PyPI wheels. The 0.10.33 wheels are tagged py3-none but contain
# platform-specific binaries, hence one build per platform (and per python
# minor, so files land in the right site-packages) — see variants.yaml.
# There is no osx-64 wheel upstream, which is why this forge skips osx-64.
schema_version: 1

context:
  version: "0.10.33"

package:
  name: mediapipe
  version: ${{ version }}

source:
  - if: linux
    then:
      url: https://files.pythonhosted.org/packages/7b/bc/0695a2af4e35a8cbeaf0957eb2342acc1541ab363f36e8b51018193e05df/mediapipe-${{ version }}-py3-none-manylinux_2_28_x86_64.whl
      sha256: 410e796215d9eb2cf1fdd6aecbf416abab6e74a5eea5572f4b6da94658c764d9
  - if: osx
    then:
      url: https://files.pythonhosted.org/packages/a7/10/593aa6429e6e2dc309b19761804b7992d61a0ef485339435f164b83c2759/mediapipe-${{ version }}-py3-none-macosx_11_0_arm64.whl
      sha256: f8dd00affe7d02479cb2e5af8ca5899d2618d6cbc316507a56d41cf62cdbc4d2
  - if: win
    then:
      url: https://files.pythonhosted.org/packages/a3/e9/c11a67dfffc2e2d9f9e68e790fc1f1342962669a0d8546c9a479a18c07a2/mediapipe-${{ version }}-py3-none-win_amd64.whl
      sha256: 25c336c1697d51dddde99dd4568f2a22a1ac46f3f28f5a5bf583a4edf55a282d

build:
  number: 0
  script:
    # pull the Apache-2.0 license out of the wheel so license_file can find it
    - python -c "import glob, zipfile; w = zipfile.ZipFile(glob.glob('mediapipe-*.whl')[0]); open('LICENSE', 'wb').write(w.read('mediapipe-${{ version }}.dist-info/licenses/LICENSE'))"
    - if: linux
      then:
        - python -m pip install mediapipe-${{ version }}-py3-none-manylinux_2_28_x86_64.whl -vv --no-deps
    - if: osx
      then:
        - python -m pip install mediapipe-${{ version }}-py3-none-macosx_11_0_arm64.whl -vv --no-deps
    - if: win
      then:
        - python -m pip install mediapipe-${{ version }}-py3-none-win_amd64.whl -vv --no-deps

requirements:
  host:
    - python
    - pip
  run:
    - python
    - absl-py >=2.3,<3
    - python-flatbuffers >=25.9
    - matplotlib-base
    - numpy
    # upstream requires opencv-contrib-python; conda-forge's py-opencv is built
    # with the contrib modules included
    - py-opencv
    - python-sounddevice >=0.5,<0.6

tests:
  - python:
      imports:
        - mediapipe
      pip_check: false

about:
  homepage: https://github.com/google-ai-edge/mediapipe
  summary: Cross-platform, customizable ML solutions for live and streaming media
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
